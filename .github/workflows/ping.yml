name: wake-etheria

on:
  schedule:
    - cron: '1 3 * * *'   # 03:01 UTC = 00:01 BRT (mantém seu agendamento)
  workflow_dispatch: {}

jobs:
  wake:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: |
          npm ci || true
          # instalar playwright se não houver package.json
          if [ ! -f package.json ]; then
            npm init -y
            npm i playwright@1.40.0
            npx playwright install --with-deps
          else
            npm i
            npx playwright install --with-deps || true
          fi

      - name: Run wake script (Playwright)
        env:
          URL: "https://etheria.streamlit.app/"
        run: |
          node .github/scripts/wake.js
