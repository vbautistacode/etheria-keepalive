name: keep-etheria-keepalive

on:
  schedule:
    - cron: '1 3 * * *'   # 03:01 UTC = 00:01 BRT
  workflow_dispatch: {}

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Quick HTTP check
        id: http_check
        run: |
          URL="https://etheria.streamlit.app/"
          echo "Pinging $URL (follow redirects)..."
          # tentar obter corpo e status; se curl falhar, status será 000
          mkdir -p /tmp/keepalive
          status=$(curl -s -L -o /tmp/keepalive/resp_body.html -w "%{http_code}" "$URL" || echo "000")
          echo "status=$status" >> $GITHUB_OUTPUT
          if [ -f /tmp/keepalive/resp_body.html ]; then
            head -c 1200 /tmp/keepalive/resp_body.html > /tmp/keepalive/resp_snippet.txt || true
            echo "snippet<<EOF" >> $GITHUB_OUTPUT
            sed -n '1,200p' /tmp/keepalive/resp_snippet.txt >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
          else
            echo "snippet<<EOF" >> $GITHUB_OUTPUT
            echo "" >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
          fi

      - name: Decide whether to run headless wake
        id: decide
        run: |
          status="${{ steps.http_check.outputs.status }}"
          snippet="${{ steps.http_check.outputs.snippet }}"
          echo "HTTP status: $status"
          # condição: status 303 ou snippet contendo indícios de 'sleep' ou 'get this app back up'
          echo "need_wake=false" >> $GITHUB_OUTPUT
          if [ "$status" = "303" ]; then
            echo "need_wake=true" >> $GITHUB_OUTPUT
            exit 0
          fi
          echo "$snippet" | grep -qiE "gone to sleep|get this app back up|wake" && echo "need_wake=true" >> $GITHUB_OUTPUT || true

      - name: Setup Node.js
        if: steps.decide.outputs.need_wake == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Playwright and dependencies
        if: steps.decide.outputs.need_wake == 'true'
        run: |
          npm init -y
          npm i playwright@1.40.0
          npx playwright install --with-deps

      - name: Run headless wake script
        if: steps.decide.outputs.need_wake == 'true'
        env:
          URL: "https://etheria.streamlit.app/"
        run: |
          node .github/scripts/wake.js

      - name: Upload wake artifacts
        if: steps.decide.outputs.need_wake == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: wake-artifacts
          path: |
            wake_before_*.png
            wake_after_*.png
            wake_before_*.html
            wake_after_*.html
