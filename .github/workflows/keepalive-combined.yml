name: keep-etheria-keepalive

on:
  schedule:
    - cron: '1 3 * * *'   # 03:01 UTC = 00:01 BRT
  workflow_dispatch: {}

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Quick HTTP check
        id: http_check
        run: |
          URL="https://etheria.streamlit.app/"
          echo "Pinging $URL (follow redirects)..."
          # obter status e salvar corpo curto
          status=$(curl -s -L -o /tmp/resp_body.html -w "%{http_code}" "$URL" || echo "000")
          echo "status=$status" >> $GITHUB_OUTPUT
          head -c 1200 /tmp/resp_body.html > /tmp/resp_snippet.txt || true
          echo "snippet<<EOF" >> $GITHUB_OUTPUT
          sed -n '1,200p' /tmp/resp_snippet.txt >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Decide whether to run headless wake
        id: decide
        run: |
          status="${{ steps.http_check.outputs.status }}"
          snippet="${{ steps.http_check.outputs.snippet }}"
          echo "HTTP status: $status"
          echo "Snippet length: ${#snippet}"
          # condição simples: se status for 303 ou snippet contiver 'gone to sleep' ou 'get this app back up'
          if [ "$status" = "303" ] || echo "$snippet" | grep -qiE "gone to sleep|get this app back up|wake"; then
            echo "need_wake=true" >> $GITHUB_OUTPUT
          else
            echo "need_wake=false" >> $GITHUB_OUTPUT
          fi

      - name: Setup Node.js
        if: steps.decide.outputs.need_wake == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Playwright and dependencies
        if: steps.decide.outputs.need_wake == 'true'
        run: |
          npm init -y
          npm i playwright@1.40.0
          npx playwright install --with-deps

      - name: Run headless wake script
        if: steps.decide.outputs.need_wake == 'true'
        env:
          URL: "https://etheria.streamlit.app/"
        run: |
          node .github/scripts/wake.js
